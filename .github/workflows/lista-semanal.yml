name: Actualizar Lista Curada (semanal)

# Cron en UTC. Domingo 12:00 UTC = mercado de EE.UU. cerrado.
# También se puede disparar a mano desde la pestaña Actions (workflow_dispatch).
on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

# Evita corridas solapadas si una tarda
concurrency:
  group: lista-semanal
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar lista_top20.json
        env:
          SEMAFORO_CODE: ${{ secrets.SEMAFORO_CODE }}
        run: python scripts/actualizar_lista.py

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "lista-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lista_top20.json
          if git diff --staged --quiet; then
            echo "Sin cambios en la lista; nada que commitear."
          else
            git commit -m "chore: actualización semanal de la Lista Curada"
            git push
          fi
